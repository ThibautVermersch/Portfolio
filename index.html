<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio de Vermersch Thibaut</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <header>
        <nav class="navbar">
            <a href="#" class="nav-link active">Accueil</a>
            <a href="#" class="nav-link">Projets</a>
            <a href="#" class="nav-link">Parcours</a>
            <a href="#" class="nav-link">Contact</a>
        </nav>
        
        <div class="header-control">
            <div class="language">
                <button type="button" class="language-button-active">FR</button>
                <button type="button" class="language-button">EN</button>
            </div>
            <button type="button" class="theme">
                <span class="icon">☀️</span>
                <span>Clair</span>
            </button>
        </div>
    </header>
    
    <section class="main-page">
        <div class="left-player">
            <div class="glow"></div>
            <div class="vinyle-orbit">
                <button type="button" class="vinyle-project">Projets</button>
                <button type="button" class="vinyle-parcours">Parcours</button>
                <button type="button" class="vinyle-contact">Contact</button>

                <div class="vinyle-center">
                    <button type="button" class="play-button" aria-label="Lancer la lecture">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="#000000" style="margin-left: 3px;">
                            <polygon points="6,4 20,12 6,20" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="right-content">
            <h1 class="name">
                Vermersch Thibaut
            </h1>
            <p class="description">
                Développeur web en formation, je crée des expérience interactives autant harmonieuses techniquement que visuellement
            </p>
            <p class="status">
                Recherche d'un stage de 8 à 10 semaines début avril 2027
            </p>
            
            <div class="cv-div">
                <a href="assets/docs/CV Thibaut Vermersch.pdf" target="_blank" class="btn-cv btn-view">
                    <span class="icon">👁️</span> Aperçu du CV
                </a>
                <a href="assets/docs/CV Thibaut Vermersch.pdf" download="CV_Vermersch_Thibaut.pdf" class="btn-cv btn-download">
                    <span class="icon">📥</span> Télécharger le CV
                </a>
            </div>
        </div>
    </section>
    
</body>
</html>
